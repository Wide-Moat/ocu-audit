name: security

on:
  push:
    branches: [main]
    # Tag refs do not match a branches: filter; without this a v* tag would
    # release from a ref these gates never scanned.
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly cron: Sunday at 02:00 UTC.
    - cron: '0 2 * * 0'

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lexicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: naming denylist
        # The denied-term list is a repository secret so the terms are not
        # themselves published. On forks (no secret) the job passes with a
        # notice; the gate is enforced on this repository's own PRs and pushes.
        env:
          DENYLIST: ${{ secrets.LEXICON_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "${DENYLIST:-}" ]; then
            echo "::notice::LEXICON_DENYLIST not configured in this context; skipping"
            exit 0
          fi
          rc=0
          hits=$(grep -rniE "$DENYLIST" --exclude-dir='.git' . 2>/tmp/grep-err) || rc=$?
          if [ "$rc" -ge 2 ]; then
            cat /tmp/grep-err >&2
            echo "::error::lexicon grep failed (rc=$rc) - fix the denylist pattern; failing closed"
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "$hits" | sed -E 's/^([^:]+:[0-9]+).*/\1: denied term/'
            echo "::error::denied term found - see the project lexicon policy"
            exit 1
          fi
          echo "lexicon clean"

  secrets-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks GitHub Action requires a paid org licence; the OSS docker
      # image does not. Run it directly with the default ruleset (the root
      # .gitleaks.toml extends the default rules, never replaces them).
      - name: gitleaks (docker, default ruleset)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner

  secrets-trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: trufflehog
        uses: trufflesecurity/trufflehog@f446421baf832d6356c42c1743d99abff52ff334 # v3.95.7
        with:
          path: ./
          extra_args: --no-verification

  sast-semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: semgrep
        # Emit SARIF for the Security tab AND keep the blocking exit code: run
        # the SARIF pass non-blocking, then a second gating pass.
        run: |
          semgrep ci --sarif --output=semgrep.sarif || true
          semgrep ci
        env:
          SEMGREP_RULES: >-
            p/security-audit p/owasp-top-ten p/golang
            p/github-actions p/secrets
          SEMGREP_SUPPRESS_ERRORS: "false"
      - name: upload semgrep SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  sca-trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: trivy filesystem - CRITICAL,HIGH blocks
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # Block on HIGH as well as CRITICAL: a HIGH dependency vuln is a real
          # exposure. The tree is clean at this floor today (no .trivyignore
          # waiver); a future HIGH is triaged with a dated, tracked entry.
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "false"

  conventional-commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
